name: Build KivyMD APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk pkg-config libffi-dev libltdl3-dev

      - name: Install buildozer
        run: pip install buildozer --break-system-packages

      - name: Create spec
        run: buildozer init

      - name: Modify buildozer spec
        run: |
          sed -i 's/^title = .*/title = FlashCard/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = flashcard/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.flashcard/' buildozer.spec
          sed -i 's/^source.include_exts = .*/source.include_exts = py,ttf/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy/' buildozer.spec
          sed -i 's/^#android.permissions = .*/android.permissions = WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE/' buildozer.spec

      - name: Build APK
        run: buildozer -v android debug deploy run

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flashcard-apk
          path: bin/*.apk
