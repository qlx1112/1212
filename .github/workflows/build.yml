name: Build Kivy APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk pkg-config libffi-dev libltdl3-dev autoconf libtool

      - name: Install buildozer
        run: pip install buildozer cython==0.29.36 --break-system-packages

      - name: Generate buildozer.spec
        run: buildozer init

      - name: Patch spec
        run: |
          cat > patch.spec <<EOF
[app]
title = FlashCard
package.name = flashcard
package.domain = org.flashcard
source.include_exts = py,ttf
requirements = python3,kivy
android.permissions = WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE
android.api = 33
android.ndk = 25b
android.sdk = 24
android.accept_sdk_license = True
EOF
          cat patch.spec >> buildozer.spec

      - name: Build APK
        env:
          ANDROID_HOME: ${{ github.workspace }}/.buildozer/android/platform/android-sdk
        run: buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashcard-apk
          path: bin/*.apk
