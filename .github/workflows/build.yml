name: Build Kivy APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git libssl-dev libffi-dev python3-dev python3-pip python3-venv openjdk-11-jdk ant

      - name: Install buildozer & dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer

      - name: Patch buildozer.spec
        run: |
          sed -i '/android.sdk_path/d' buildozer.spec

      - name: Build APK
        env:
          ANDROID_HOME: ${{ github.workspace }}/.buildozer/android/platform/android-sdk
        run: buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-artifact
          path: bin/*.apk
